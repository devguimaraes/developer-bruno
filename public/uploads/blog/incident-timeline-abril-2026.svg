<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="860" viewBox="0 0 1400 860">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
  </defs>
  <rect width="1400" height="860" fill="url(#bg)"/>
  <text x="70" y="90" fill="#93c5fd" font-family="Arial, sans-serif" font-size="28" font-weight="700">CRONOLOGIA DOS INCIDENTES • ABRIL 2026</text>

  <line x1="180" y1="170" x2="180" y2="760" stroke="#334155" stroke-width="6"/>

  <circle cx="180" cy="240" r="14" fill="#60a5fa"/>
  <rect x="230" y="190" width="1080" height="120" rx="12" fill="#111827" stroke="#60a5fa"/>
  <text x="260" y="240" fill="#e2e8f0" font-family="Arial, sans-serif" font-size="30" font-weight="700">19–21 ABR • Vercel publica boletim e IOCs oficiais</text>
  <text x="260" y="275" fill="#94a3b8" font-family="Arial, sans-serif" font-size="23">Vetor: OAuth de terceiro comprometido + acesso a variáveis não sensíveis.</text>

  <circle cx="180" cy="410" r="14" fill="#f59e0b"/>
  <rect x="230" y="360" width="1080" height="120" rx="12" fill="#111827" stroke="#f59e0b"/>
  <text x="260" y="410" fill="#f8fafc" font-family="Arial, sans-serif" font-size="30" font-weight="700">20 ABR • Caso Lovable ganha tração pública</text>
  <text x="260" y="445" fill="#94a3b8" font-family="Arial, sans-serif" font-size="23">Tema: autorização (BOLA), visibilidade de projetos e comunicação inicial confusa.</text>

  <circle cx="180" cy="580" r="14" fill="#22c55e"/>
  <rect x="230" y="530" width="1080" height="120" rx="12" fill="#111827" stroke="#22c55e"/>
  <text x="260" y="580" fill="#f8fafc" font-family="Arial, sans-serif" font-size="30" font-weight="700">22 ABR • Prioridade para times: resposta e mitigação</text>
  <text x="260" y="615" fill="#94a3b8" font-family="Arial, sans-serif" font-size="23">Rotação de segredos, revisão de OAuth e private-by-default.</text>

  <rect x="70" y="700" width="1240" height="90" rx="10" fill="#0b1220" stroke="#334155"/>
  <text x="95" y="755" fill="#cbd5e1" font-family="Arial, sans-serif" font-size="24">Fontes-base: Vercel Security Bulletin, TechCrunch, The Register, FAQ da Lovable.</text>
</svg>
