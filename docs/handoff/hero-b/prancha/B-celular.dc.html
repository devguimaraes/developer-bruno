<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>Hero B, celular</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="ds/giro/tokens.css">
<link rel="stylesheet" href="ds/giro/components/bundle.css">
<link rel="stylesheet" href="hero.css">
<link rel="stylesheet" href="hero-b.css">
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Anybody:wdth,wght@50..150,100..900&amp;family=Geist+Mono:wght@400;500&amp;display=swap">
<style>
body{margin:0;background:#2b2eff}
</style>
</helmet>
<div style="width: 390px; height: 844px; overflow: hidden">
<dc-import name="B" layout="mobile" autoplay="{{autoplay}}" reduced-motion="{{reducedMotion}}" rolagem="{{rolagem}}" hint-size="390px,844px"></dc-import>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"autoplay":{"editor":"boolean","default":true},"reducedMotion":{"editor":"boolean","default":false},"rolagem":{"editor":"range","default":0,"min":0,"max":100,"step":1,"unit":"%"},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  // A mesma pilha da prancha do computador, montada no layout do celular.
  renderVals() {
    return {
      autoplay: this.props.autoplay !== false,
      reducedMotion: this.props.reducedMotion === true,
      rolagem: Number(this.props.rolagem) || 0,
    };
  }
}
</script>
</body>
</html>
