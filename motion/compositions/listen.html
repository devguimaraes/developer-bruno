    <p data-hf-id="hf-3ppy" id="listen-caption" class="caption">O arco pulsa com as teclas e os olhos seguem o texto.</p>
  </div>
  <script>
    (function () {
      const tl = gsap.timeline({ paused: true });
      const ft = GiroRig.ft;
      const E = GiroRig.E;
      const g = GiroRig.create(document.querySelector("#listen-giro"), { v: "nov" });
      const P = g.P;
      g.init(tl);
      g.idle(tl, 0, 0.35);

      // Entra em "ouvindo": arco curto no topo, olhos para baixo e à esquerda.
      ft(tl, P.arc, { attr: { "stroke-dasharray": "240 37" } }, { attr: { "stroke-dasharray": "30 247" }, duration: 0.52, ease: E.resolve }, 0.35);
      ft(tl, P.turn, { rotation: -21.5 }, { rotation: -105, duration: 0.56, ease: E.turn }, 0.35);
      ft(tl, P.eyes, { x: 0, y: 0 }, { x: -5, y: 3, duration: 0.26, ease: E.resolve }, 0.35);

      // Digitação com ritmo fixo: pausa maior depois de pontuação.
      const chars = Array.prototype.slice.call(document.querySelectorAll("#listen-field .listen-ch"));
      let at = 0.95;
      const times = chars.map(function (ch) {
        const t = at;
        const c = ch.textContent;
        at += c === "," || c === "!" ? 0.2 : c === " " ? 0.06 : 0.075 + (chars.indexOf(ch) % 3) * 0.015;
        return t;
      });
      chars.forEach(function (ch, i) {
        tl.set(ch, { display: "inline" }, times[i]);
        if (i % 3 === 0) {
          ft(tl, P.arc, { attr: { "stroke-dasharray": "30 247" } }, { attr: { "stroke-dasharray": "46 231" }, duration: 0.06, ease: E.easeOut }, times[i]);
          ft(tl, P.arc, { attr: { "stroke-dasharray": "46 231" } }, { attr: { "stroke-dasharray": "30 247" }, duration: 0.14, ease: E.resolve }, times[i] + 0.06);
        }
      });
      // Olhos acompanham o texto a cada quatro letras.
      let lastX = -5;
      for (let i = 4; i < chars.length; i += 4) {
        const x = -5 + (10 * i) / (chars.length - 1);
        ft(tl, P.eyes, { x: lastX }, { x: x, duration: 0.26, ease: E.resolve }, times[i]);
        lastX = x;
      }
      const typedEnd = times[times.length - 1];

      // Cursor pisca depois que a digitação para.
      GiroRig.loop(tl, typedEnd + 0.3, 4.5, function (e) {
        gsap.set("#listen-caret", { opacity: Math.floor(e / 0.5) % 2 === 0 ? 0 : 1 });
      });

      // Volta ao repouso.
      const back = typedEnd + 0.3;
      ft(tl, P.arc, { attr: { "stroke-dasharray": "30 247" } }, { attr: { "stroke-dasharray": "240 37" }, duration: 0.52, ease: E.resolve }, back);
      ft(tl, P.turn, { rotation: -105 }, { rotation: -21.5, duration: 0.56, ease: E.turn }, back);
      ft(tl, P.eyes, { x: lastX, y: 3 }, { x: 0, y: 0, duration: 0.34, ease: E.resolve }, back);
      g.idle(tl, back + 0.6, 4.5);

      tl.fromTo("#listen-label", { opacity: 0, filter: "blur(8px)" }, { opacity: 1, filter: "blur(0px)", duration: 0.18, ease: "power4.out" }, 0);
      tl.fromTo("#listen-caption", { opacity: 0, filter: "blur(8px)" }, { opacity: 1, filter: "blur(0px)", duration: 0.18, ease: "power4.out" }, 0.1);
      tl.to(["#listen-label", "#listen-caption"], { opacity: 0, filter: "blur(8px)", duration: 0.15, ease: "power2.in" }, 4.3);
      window.__timelines["listen"] = tl;
    })();
  </script>
