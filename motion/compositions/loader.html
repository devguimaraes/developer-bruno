  <script>
    (function () {
      const tl = gsap.timeline({ paused: true });
      const ft = GiroRig.ft;
      const E = GiroRig.E;
      const AZUL = "#2b2eff";
      const LIMA = "#d2ff4d";
      const all = (s) => Array.prototype.slice.call(document.querySelectorAll(s));

      // Tempos locais da tomada (s). Primeira volta: o nome. Depois, uma cor e uma linha a cada meia volta.
      const T = { unfold: 0.08, trocas: [1.0, 1.45, 1.9, 2.35], pronto: 2.565, saida: 2.965, voo: 0.52 };

      // O nome se desdobra do Giro para fora: largura de 50% a 115%, 35 ms entre letras.
      function unfold(s, t) {
        const L = [];
        const R = [];
        all(s.id + " .ld-overlay .sig").forEach(function (sig) {
          all("#" + sig.parentNode.id + " .sig-l > .lt").reverse().forEach(function (el, i) { (L[i] = L[i] || []).push(el); });
          all("#" + sig.parentNode.id + " .sig-r > .lt").forEach(function (el, i) { (R[i] = R[i] || []).push(el); });
        });
        L.concat([]).forEach(function (els, i) { letter(els, t + i * 0.035); });
        R.forEach(function (els, i) { letter(els, t + i * 0.035); });
        if (s.shift) ft(tl, all(s.id + " .sig"), { x: s.shift }, { x: 0, duration: 0.72, ease: E.resolve }, t);
      }
      function letter(els, t) {
        ft(tl, els, { fontStretch: "50%", opacity: 0 }, { fontStretch: "115%", opacity: 1, duration: 0.4, ease: E.resolve }, t);
      }

      // Troca: o disco da cor nova nasce do Giro e o Giro muda de cor no mesmo quadro.
      function troca(s, g, camada, t, cor) {
        tl.set(g.P.svg, { color: cor }, t);
        const at = " at " + s.ox + "px " + s.oy + "px)";
        ft(tl, camada, { clipPath: "circle(" + s.r0 + "px" + at }, { clipPath: "circle(" + s.r1 + "px" + at, duration: 0.215, ease: E.resolve }, t);
      }

      // Linha k: digitada em 260 ms, um caractere por passo, com o cursor na ponta.
      function digita(s, k, t) {
        const cur = all(s.id + " .ln" + k + " .cur");
        const n = document.querySelector(s.id + " .ln" + k + " .tx").children.length;
        for (let i = 0; i < n; i++) {
          tl.set(all(s.id + " .ln" + k + " .ch:nth-child(" + (i + 1) + ")"), { opacity: 1 }, t + ((i + 1) * 0.26) / n);
        }
        if (k > 1) tl.set(all(s.id + " .ln" + (k - 1) + " .cur"), { opacity: 0 }, t);
        tl.set(cur, { opacity: 1 }, t);
        ft(tl, cur, { x: 0 }, { x: n * 0.6 * s.mono, duration: 0.26, ease: "steps(" + n + ")" }, t);
      }

      // No papel, o "o" é selecionado como componente: caixa, alças e etiqueta.
      function seleciona(s, t) {
        const box = all(s.id + " .sel");
        ft(tl, box, { opacity: 0, scale: 1.15 }, { opacity: 1, scale: 1, duration: 0.22, ease: E.resolve }, t);
        tl.set(all(s.id + " .hd"), { scale: 0 }, t - 0.001);
        all(s.id + " .hd").forEach(function (hd, i) {
          ft(tl, hd, { scale: 0 }, { scale: 1, duration: 0.24, ease: E.hop }, t + 0.03 + (i % 4) * 0.03);
        });
        ft(tl, all(s.id + " .tag"), { opacity: 0, y: 8 }, { opacity: 1, y: 0, duration: 0.22, ease: E.resolve }, t + 0.06);
      }

      // Oi do hello.html e repouso.
      function oi(g, t, fim) {
        const turns = [44.5, 8, 72, 18, 60, 44.5];
        const leans = [0, -4, 4, -3, 2, 0];
        for (let i = 1; i < turns.length; i++) {
          const at = t + (i - 1) * 0.3;
          ft(tl, g.P.turn, { rotation: turns[i - 1] }, { rotation: turns[i], duration: 0.3, ease: E.inOut }, at);
          ft(tl, g.P.body, { rotation: leans[i - 1], svgOrigin: "60 104" }, { rotation: leans[i], duration: 0.3, ease: E.inOut }, at);
        }
        g.settle(tl, t + 1.5);
        g.idle(tl, t + 2.06, fim);
      }

      function tomada(s) {
        const t0 = s.t0;
        const g = GiroRig.create(document.querySelector(s.giro), { v: "nov" });
        g.init(tl);
        g.loading(tl, t0);
        unfold(s, t0 + T.unfold);
        // O traço engrossa até o peso das letras.
        ft(tl, g.P.arc, { attr: { "stroke-width": 12 } }, { attr: { "stroke-width": 22 }, duration: 0.5, ease: E.resolve }, t0 + 0.15);
        const cores = [AZUL, AZUL, LIMA, LIMA];
        s.camadas.forEach(function (c, i) {
          troca(s, g, c, t0 + T.trocas[i], cores[i]);
          if (i < 3) digita(s, i + 1, t0 + T.trocas[i] + 0.05);
        });
        seleciona(s, t0 + T.trocas[1] + 0.05);
        g.done(tl, t0 + T.pronto);
        tl.set(all(s.id + " .cur"), { opacity: 0 }, t0 + T.pronto);
        const te = t0 + T.saida;
        s.saida(g, te);
        oi(g, te + T.voo, s.fim);
      }

      // Computador: a assinatura inteira encolhe até o header e o painel azul sobe.
      const D = { id: "#ld-shot-1", t0: 1.4, fim: 7.3, giro: "#ld-giro-1", ox: 677.8, oy: 455.9, r0: 52, r1: 1420, shift: 282.2, mono: 26,
        camadas: ["#ld-s1-lima", "#ld-s1-papel", "#ld-s1-tinta", "#ld-s1-azul2"] };
      D.saida = function (g, te) {
        tl.set(all("#ld-s1-overlay .lt"), { opacity: 0 }, te);
        tl.set(all("#ld-s1-fly .sig-l, #ld-s1-fly .sig-r"), { opacity: 1 }, te);
        ft(tl, "#ld-s1-fly", { x: 0, y: 0, scale: 1, transformOrigin: "0px 0px" }, { x: 155 - 677.8, y: 31 - 392, scale: 26 / 136, duration: T.voo, ease: E.resolve }, te);
        ft(tl, "#ld-s1-overlay", { clipPath: "inset(0% 0% 0% 0%)" }, { clipPath: "inset(0% 0% 100% 0%)", duration: T.voo, ease: E.resolve }, te);
        ft(tl, all("#ld-s1-dest .ld-kicker, #ld-s1-dest .ld-case"), { y: 24 }, { y: 0, duration: T.voo, ease: E.resolve }, te);
      };

      // Celular: a volta termina na tinta, o painel desce até a barra e o Giro pousa no botão.
      const M = { id: "#ld-shot-2", t0: 8.7, fim: 14.6, giro: "#ld-giro-2", ox: 199, oy: 329.5, r0: 20, r1: 570, shift: 0, mono: 15,
        camadas: ["#ld-s2-lima", "#ld-s2-papel", "#ld-s2-tinta"] };
      M.saida = function (g, te) {
        ft(tl, "#ld-s2-fly", { x: 0, y: 0, scale: 1 }, { x: 195 - 199, y: 762 - 329.5, scale: 40 / 37, duration: T.voo, ease: E.resolve }, te);
        ft(tl, g.P.arc, { attr: { "stroke-width": 22 } }, { attr: { "stroke-width": 14 }, duration: T.voo, ease: E.resolve }, te);
        ft(tl, "#ld-s2-overlay", { clipPath: "inset(0% 0% 0% 0%)" }, { clipPath: "inset(100% 0% 0% 0%)", duration: T.voo, ease: E.resolve }, te);
        ft(tl, "#ld-s2-dest .ld-case-phone", { y: 24 }, { y: 0, duration: T.voo, ease: E.resolve }, te);
      };

      tomada(D);
      tomada(M);
      window.__timelines["loader"] = tl;
    })();
  </script>
