  <div data-hf-id="hf-pk10" id="root" data-composition-id="peek" data-width="1920" data-height="1080">
    <p data-hf-id="hf-pk11" id="peek-label" class="scene-label">// espiando · página parada numa seção</p>
    <svg data-hf-id="hf-pk12" id="peek-giro" class="giro" viewBox="0 0 120 120" aria-hidden="true">
      <circle data-hf-id="hf-pk13" class="g-disc" cx="60" cy="60" r="60" />
      <g data-hf-id="hf-pk14" class="g-body">
        <g data-hf-id="hf-pk15" class="g-turn"><g data-hf-id="hf-pk16" class="g-spin"><circle data-hf-id="hf-pk17" class="g-arc" cx="60" cy="60" r="44" /></g></g>
        <g data-hf-id="hf-pk18" class="g-lid g-lid-l"><ellipse data-hf-id="hf-pk19" class="g-eye g-eye-l" cx="46" cy="54" rx="6" ry="9" /></g>
        <g data-hf-id="hf-pk20" class="g-lid g-lid-r"><ellipse data-hf-id="hf-pk21" class="g-eye g-eye-r" cx="74" cy="54" rx="6" ry="9" /></g>
        <path data-hf-id="hf-pk22" class="g-f g-happy-l" d="M38 60 Q46 46 54 60" />

    <p data-hf-id="hf-pk31" id="peek-timer">// parado · 5 s</p>
    <div data-hf-id="hf-pk32" id="peek-page">
      <p data-hf-id="hf-pk33" class="peek-line">Front-end vive de estados: carregando,<span data-hf-id="hf-pk34" class="peek-mark"></span></p>
      <p data-hf-id="hf-pk35" class="peek-line">vazio, erro e pronto. Cada um merece<span data-hf-id="hf-pk36" class="peek-mark"></span></p>
      <p data-hf-id="hf-pk37" class="peek-line">um desenho, não só um spinner.<span data-hf-id="hf-pk38" class="peek-mark"></span></p>
    </div>
    <p data-hf-id="hf-pk39" id="peek-caption" class="caption">Parado 5 s, ele lê junto. Na primeira rolagem, volta ao repouso.</p>
  </div>
  <script>
    (function () {
      const tl = gsap.timeline({ paused: true });
      const ft = GiroRig.ft;
      const E = GiroRig.E;
      const g = GiroRig.create(document.querySelector("#peek-giro"), { v: "nov" });
      const P = g.P;
      const origin = "60 104";
      g.init(tl);
      g.idle(tl, 0, 1.4);

      // Entra: olhos no começo da linha e o corpo inclina 3° na direção do texto.
      ft(tl, P.eyes, { x: 0, y: 0 }, { x: -1, y: 2, duration: 0.34, ease: E.resolve }, 1.4);
      ft(tl, P.body, { rotation: 0, svgOrigin: origin }, { rotation: 3, svgOrigin: origin, duration: 0.56, ease: E.turn }, 1.4);

      // Lê três linhas: varre devagar em inOut e volta rápido, uma linha abaixo, em resolve.
      const marks = Array.prototype.slice.call(document.querySelectorAll("#peek-page .peek-mark"));
      const READ = 1.1;
      const RETURN = 0.2;
      marks.forEach(function (mark, i) {
        const t = 1.8 + i * (READ + 0.25);
        const y = 2 + i * 1.5;
        ft(tl, P.eyes, { x: -1, y: y }, { x: 5, duration: READ, ease: E.inOut }, t);
        ft(tl, mark, { scaleX: 0 }, { scaleX: 1, duration: READ, ease: E.inOut }, t);
        if (i < marks.length - 1) {
          ft(tl, P.eyes, { x: 5, y: y }, { x: -1, y: y + 1.5, duration: RETURN, ease: E.resolve }, t + READ);
        }
      });

      // Rolou: a página sobe e o Giro volta ao repouso, com uma piscada no meio.
      const scroll = 5.75;
      ft(tl, "#peek-page", { y: 0 }, { y: -150, opacity: 0.25, duration: 0.5, ease: E.resolve }, scroll);
      ft(tl, P.eyes, { x: 5, y: 5 }, { x: 0, y: 0, duration: 0.34, ease: E.resolve }, scroll);
      ft(tl, P.body, { rotation: 3, svgOrigin: origin }, { rotation: 0, svgOrigin: origin, duration: 0.56, ease: E.turn }, scroll);
      g.blink(tl, scroll + 0.12);
      g.idle(tl, scroll + 0.6, 7);

      tl.fromTo("#peek-label", { opacity: 0, filter: "blur(8px)" }, { opacity: 1, filter: "blur(0px)", duration: 0.18, ease: "power4.out" }, 0);
      tl.fromTo("#peek-caption", { opacity: 0, filter: "blur(8px)" }, { opacity: 1, filter: "blur(0px)", duration: 0.18, ease: "power4.out" }, 0.1);
      tl.fromTo("#peek-timer", { opacity: 0 }, { opacity: 1, duration: 0.18, ease: "power4.out" }, 1.1);
      tl.to("#peek-timer", { opacity: 0, duration: 0.15, ease: "power2.in" }, scroll);
      tl.to(["#peek-label", "#peek-caption"], { opacity: 0, filter: "blur(8px)", duration: 0.15, ease: "power2.in" }, 6.8);
      window.__timelines["peek"] = tl;
    })();
  </script>
