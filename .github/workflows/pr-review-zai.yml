name: '🔎 PR Review (Z.ai)'

on:
  pull_request:
    types: ['opened', 'synchronize', 'ready_for_review']

concurrency:
  group: 'pr-review-zai-${{ github.event.pull_request.number }}'
  cancel-in-progress: true

permissions:
  contents: 'read'
  pull-requests: 'write'

jobs:
  review:
    runs-on: 'ubuntu-latest'
    timeout-minutes: 10
    if: '!github.event.pull_request.draft'
    steps:
      - name: 'Checkout repository'
        uses: 'actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683' # v4
        with:
          fetch-depth: 0

      - name: 'Setup Node.js'
        uses: 'actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020' # v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: 'Install Claude Code'
        run: 'npm install -g @anthropic-ai/claude-code'

      - name: 'Prepare review prompt'
        env:
          PR_TITLE: '${{ github.event.pull_request.title }}'
          PR_BODY: '${{ github.event.pull_request.body }}'
        run: |
          BASE_SHA="${{ github.event.pull_request.base.sha }}"
          HEAD_SHA="${{ github.event.pull_request.head.sha }}"

          # Save diff to file
          git diff "${BASE_SHA}...${HEAD_SHA}" > /tmp/pr-diff.txt

          # Build prompt from template (env vars used safely via shell, not ${{ }})
          cat > /tmp/review-prompt.txt <<'TEMPLATE'
          Você é um revisor de código sênior. Revise o diff do PR abaixo e responda EXCLUSIVAMENTE em português do Brasil.

          ## Foco da revisão (somente estes itens):

          - **Bugs**: Lógica incorreta, edge cases não tratados, condições de corrida, uso incorreto de APIs
          - **Regressões**: Mudanças que quebram comportamento existente ou removem funcionalidade acidentalmente
          - **Segurança**: Injeção, XSS, exposição de secrets, validação insuficiente de entrada, OWASP Top 10
          - **Performance crítica**: Loops O(n²) desnecessários, memory leaks, re-renders excessivos em React, queries ineficientes
          - **Arquitetura**: Acoplamento indevido, violação de contratos de interface, quebra de abstrações existentes

          ## O que NÃO comentar:

          - Estilo de código, formatação, convenções de nomenclatura (use o linter para isso)
          - Comentários ou docstrings faltantes
          - Refactors cosméticos ou preferências pessoais
          - Sugestões vagas como "considere verificar" ou "poderia melhorar"

          ## Formato da resposta

          Use este formato EXATO para cada issue encontrada:

          ### [SEVERIDADE] Título breve

          **Arquivo**: `caminho/do/arquivo.ext:linha`
          **Problema**: Descrição objetiva do problema
          **Correção sugerida**:
          ```linguagem
          // código corrigido
          ```

          Severidades: 🔴 Crítico | 🟠 Alto | 🟡 Médio | 🟢 Baixo

          Se não encontrar problemas relevantes, responda apenas:

          ✅ Nenhum problema relevante encontrado no PR.

          No final, inclua um resumo breve (2-3 linhas) do impacto geral das mudanças.

          ---
          TEMPLATE

          # Append PR metadata (env vars, not raw ${{ }})
          {
            echo ""
            echo "**Título do PR**: ${PR_TITLE}"
            echo ""
            echo "**Descrição do PR**:"
            echo "${PR_BODY}"
            echo ""
            echo "**Diff**:"
            cat /tmp/pr-diff.txt
          } >> /tmp/review-prompt.txt

      - name: 'Run AI Review'
        id: 'review'
        env:
          ANTHROPIC_BASE_URL: 'https://api.z.ai/api/anthropic'
          ANTHROPIC_API_KEY: '${{ secrets.ZAI_API_KEY }}'
          GITHUB_TOKEN: '${{ secrets.GITHUB_TOKEN }}'
        run: |
          PR_NUMBER="${{ github.event.pull_request.number }}"
          REPO="${{ github.repository }}"

          # Run Claude Code in non-interactive mode
          claude -p "$(cat /tmp/review-prompt.txt)" \
            --max-turns 1 \
            --output-format text \
            2>/dev/null > /tmp/review-output.txt

          # Post review as PR comment
          gh pr comment "${PR_NUMBER}" \
            --repo "${REPO}" \
            --body-file /tmp/review-output.txt
