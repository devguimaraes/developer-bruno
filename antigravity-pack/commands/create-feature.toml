
description = "Plan and implement a new feature following GEMINI.md guidelines with focus on clarity, observability, security,"

[[steps]]
type = "tool"
tool_name = "task_boundary"
arguments = { TaskName = "Planning Feature", TaskSummary = "Initiating feature planning", TaskStatus = "Creating implementation plan", Mode = "PLANNING", PredictedTaskSize = 10 }

[[steps]]
type = "tool"
tool_name = "read_file"
arguments = { path = "GEMINI-verbose.md" }

[[steps]]
type = "tool"
tool_name = "write_to_file"
arguments = { TargetFile = "docs/implementation_plan.md", IsArtifact = true, ArtifactType = "implementation_plan", Summary = "Plan for new feature", CodeContent = "# Feature Implementation Plan\n\n## Goal\n[Describe goal]\n\n## Changes\n[List changes]\n\n## Verification\n[Plan verification]" }

[[steps]]
type = "tool"
tool_name = "notify_user"
arguments = { Message = "Please review the implementation plan.", BlockedOnUser = true, ShouldAutoProceed = false, PathsToReview = ["docs/implementation_plan.md"] }
